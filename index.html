/* ===== 竞赛项目 · 小卡超市（版式照搬 桌面/作品集/作品/小卡超市/作品集.html） ===== */
@keyframes holoShift{from{background-position:0% 50%}to{background-position:300% 50%}}
.blk.poca-blk{display:block;padding:0;min-height:0;background:#FAF8FB}
.poca{--paper:#FAF8FB;--paper2:#F3EFF6;--ink:#1A1A1A;--inkS:#57524A;--inkF:#9C968C;--line:#E8E2EC;--line2:#D9D1E2;--rose:#E7B0C4;--gold:#D2B98C;--lilac:#A791D2;--serif:"Noto Serif SC","Songti SC","STSong",SimSun,serif;--latin:Georgia,"Cormorant Garamond",serif;--holo:linear-gradient(115deg,#E7B0C4,#D2B98C 38%,#A791D2 72%,#E7B0C4);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:300;line-height:1.8;letter-spacing:.01em;color:var(--fg);background:var(--paper)}
.poca *{box-sizing:border-box;margin:0;padding:0}
.poca .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 clamp(26px,6vw,76px)}
.poca.sec-wrap{display:flex;align-items:center;min-height:calc(100vh - 56px);padding:7vh 0;border-top:1px solid var(--line)}
.poca .eyebrow{display:flex;align-items:center;gap:14px;font-family:var(--latin);font-style:italic;font-size:14.5px;color:var(--inkF);letter-spacing:.06em}
.poca .eyebrow::before{content:"";width:34px;height:1px;background:var(--holo);flex:none}
.poca .section-title{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.6vw,48px);line-height:1.22;letter-spacing:.02em;margin-top:14px}
.poca .lead{color:var(--inkS);font-size:clamp(13.5px,1.35vw,17px);line-height:1.95;max-width:58ch;margin-top:14px}
.poca .holo-text{background:linear-gradient(120deg,#C0AFE6,#E7B0C4 22%,#A791D2 46%,#D2B98C 68%,#C0AFE6);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:holoShift 20s linear infinite}

/* hero */
.poca.hero-sec{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:clamp(32px,5vw,76px);min-height:calc(100vh - 56px);max-width:1300px;margin:0 auto;padding:5vh clamp(26px,6vw,76px);position:relative;overflow:hidden}
.poca.hero-sec::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(52% 42% at 80% 30%,rgba(231,176,196,.16),transparent 70%),radial-gradient(46% 40% at 18% 80%,rgba(169,148,212,.14),transparent 70%)}
.poca .hero-inner{position:relative;z-index:2}
.poca .poca-h1{font-family:var(--serif);font-weight:600;font-size:clamp(46px,8vw,100px);line-height:1.06;letter-spacing:.01em;margin-top:18px}
.poca .latin-tag{font-family:var(--latin);font-style:italic;font-size:clamp(12px,1.1vw,17px);color:var(--inkF);letter-spacing:.24em;margin-top:12px}
.poca .slogan{font-family:var(--serif);font-weight:300;font-size:clamp(16px,1.9vw,25px);line-height:1.6;margin-top:24px;max-width:20em}
.poca .slogan b{font-weight:600}
.poca .sub{color:var(--inkS);font-size:clamp(12.5px,1.2vw,15.5px);line-height:1.95;margin-top:12px;max-width:44ch}
.poca .meta{margin-top:16px;font-size:11.5px;letter-spacing:.1em;color:var(--inkF)}
.poca .hero-stage{position:relative;z-index:1;width:clamp(140px,16vw,224px)}
.poca .phone-tag{position:absolute;left:-22px;bottom:36px;transform:rotate(-90deg);transform-origin:left center;font-family:var(--latin);font-style:italic;font-size:10.5px;letter-spacing:.22em;color:var(--inkF);white-space:nowrap}

/* 截图 */
.poca .shot{position:relative;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 22px 50px -26px rgba(26,26,26,.36)}
.poca .shot img{display:block;width:100%;height:auto;transition:transform 1s var(--e)}
.poca .shot .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(231,176,196,.45),rgba(210,185,140,.38) 38%,rgba(169,148,212,.45) 72%,rgba(231,176,196,.45));mix-blend-mode:multiply;opacity:0;transition:opacity .6s var(--e)}
.poca .shot:hover img{transform:scale(1.03)}
.poca .shot:hover .sheen{opacity:.42}
.poca .shot.empty{border:1px dashed var(--line2);background:transparent;box-shadow:none}
.poca .shot .ph{display:grid;place-items:center;min-height:150px;padding:20px;color:var(--inkF);font-size:11.5px;line-height:1.9;letter-spacing:.08em;text-align:center}

/* 初衷 */
.poca .motive-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(30px,5vw,72px);align-items:start;width:100%}
.poca .motive-title{font-family:var(--serif);font-weight:300;font-size:clamp(23px,2.9vw,38px);line-height:1.45;margin-top:16px;letter-spacing:.01em}
.poca .motive-title em{font-style:normal;font-weight:600}
.poca .motive-sub{color:var(--inkS);font-size:13.5px;line-height:1.95;margin-top:14px;max-width:52ch}
.poca .mp{display:flex;gap:18px;padding:17px 0;border-top:1px solid var(--line)}
.poca .mp:last-child{border-bottom:1px solid var(--line)}
.poca .mp .zi{font-family:var(--serif);font-weight:600;font-size:clamp(32px,3.4vw,48px);line-height:1;width:1.15em;flex:none}
.poca .mp b{font-family:var(--serif);font-weight:600;font-size:15.5px;display:block;letter-spacing:.05em}
.poca .mp p{color:var(--inkS);font-size:12.5px;line-height:1.75;margin-top:4px}

/* 核心特色 */
.poca .feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,72px);align-items:center;width:100%}
.poca .f-num{font-family:var(--latin);font-style:italic;font-size:13.5px;color:var(--inkF);letter-spacing:.1em}
.poca .f-text h3{font-family:var(--serif);font-weight:600;font-size:clamp(21px,2.5vw,32px);margin-top:10px;letter-spacing:.02em;line-height:1.3}
.poca .f-en{font-family:var(--latin);font-style:italic;font-size:13.5px;color:var(--inkF);letter-spacing:.14em;margin-top:6px}
.poca .f-text>p{color:var(--inkS);font-size:13.5px;line-height:1.9;margin-top:12px;max-width:46ch}
.poca .f-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.poca .f-tags span{font-size:11px;letter-spacing:.06em;color:var(--inkS);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.poca .f-visual{display:flex;gap:14px;justify-content:center;align-items:flex-start}
.poca .f-visual .shot{flex:0 0 auto;width:min(168px,15vw)}
.poca .f-visual .shot.lg{width:min(206px,18vw)}
.poca .f-visual .shot:nth-child(2){margin-top:30px}
.poca .f-visual.single{flex-direction:column;align-items:center}
.poca .f-visual.single .shot{width:min(430px,36vw);margin-top:0}
.poca .f-visual.single .shot.scrx{width:100%;max-width:100%;height:min(58vh,470px);overflow-x:auto;overflow-y:hidden;display:block;border-radius:14px;background:#fff;box-shadow:0 20px 50px -22px rgba(26,26,26,.4)}
.poca .f-visual.single .shot.scrx img{height:100%;width:auto;max-width:none;display:block;border-radius:0;box-shadow:none}
.poca .f-visual.single .shot.scrx .sheen{display:none}
.poca .f-visual.single .shot.empty{aspect-ratio:16/9}
.poca .f-3{display:flex;gap:14px;justify-content:center;align-items:flex-end}
.poca .f-3 .f-col{display:flex;flex-direction:column;gap:14px;align-items:center}
.poca .f-3 .f-col .shot{width:min(126px,11vw)}
.poca .f-3>.shot{width:min(168px,15vw)}
.poca .f-visual.f-3 .shot{margin-top:0}

/* 流程条 */
.poca .flow{margin-top:18px;display:flex;flex-direction:column}
.poca .flow .step{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.poca .flow .step:last-child{border-bottom:1px solid var(--line)}
.poca .flow .step .i{font-family:var(--latin);font-style:italic;color:#C98CA6;font-size:15px;width:20px;flex:none;margin-top:2px}
.poca .flow .step .t b{font-family:var(--serif);font-weight:600;font-size:14.5px;display:block;letter-spacing:.03em}
.poca .flow .step .t span{color:var(--inkS);font-size:12.5px;line-height:1.7;display:block;margin-top:3px}

/* 线框 → 成品 */
.poca .ft-head{display:flex;flex-direction:column;gap:4px;margin-bottom:clamp(24px,4vh,44px)}
.poca .ft-head .lead{margin-top:10px}

/* 演示视频 */
.poca .demo-frame{position:relative;width:auto;height:min(62vh,540px);aspect-ratio:592/1280;border-radius:16px;overflow:hidden;background:#0f0f0f;border:1px solid var(--line);box-shadow:0 34px 80px -34px rgba(26,26,26,.5)}
.poca .demo-frame video{width:100%;height:100%;object-fit:contain;display:block}
.poca .demo-frame.ph{display:grid;place-items:center;background:#F3EFF6;border:1px dashed #C9BFD8;box-shadow:none;color:#7C7390;font-size:12.5px;letter-spacing:.06em;line-height:2;text-align:center}
.poca .demo-frame .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(231,176,196,.35),rgba(169,148,212,.35));mix-blend-mode:screen;opacity:.14}
.poca .demo-caption{margin-top:12px;text-align:center;font-size:11.5px;letter-spacing:.08em;color:var(--inkF)}

/* 营销方案 */
.poca .mk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,26px);margin-top:clamp(24px,4vh,42px)}
.poca .mk-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(16px,1.8vw,24px);transition:transform .6s var(--e),box-shadow .6s var(--e)}
.poca .mk-card:hover{transform:translateY(-5px);box-shadow:0 26px 54px -30px rgba(26,26,26,.22)}
.poca .mk-media{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.poca .mk-media .shot{width:100%;max-width:100%;box-shadow:0 16px 36px -24px rgba(26,26,26,.34)}
.poca .mk-media .shot.sec{width:54%;max-width:100%}
.poca .mk-media .shot img{width:100%;height:auto}
.poca .mk-cap{font-family:var(--latin);font-style:italic;font-size:10px;color:var(--inkF);letter-spacing:.1em;text-align:center;margin-bottom:6px}
.poca .mk-card>b{font-family:var(--serif);font-weight:600;font-size:clamp(18px,1.9vw,24px);letter-spacing:.02em;display:block}
.poca .mk-en{font-family:var(--latin);font-style:italic;font-size:12px;color:var(--inkF);letter-spacing:.14em;margin-top:4px}
.poca .mk-card>p{color:var(--inkS);font-size:12.5px;line-height:1.85;margin-top:10px}

@media(max-width:900px){
  .poca.hero-sec{grid-template-columns:1fr;padding:5vh clamp(26px,6vw,76px);gap:26px;min-height:0}
  .poca .hero-stage{width:min(180px,48vw);margin:0 auto;order:-1}
  .poca .phone-tag{display:none}
  .poca .motive-grid{grid-template-columns:1fr;gap:26px}
  .poca .feature{grid-template-columns:1fr;gap:24px}
  .poca .f-visual{order:-1}
  .poca .f-visual .shot{width:min(150px,38vw)}
  .poca .f-visual.single .shot,.poca .demo-frame{width:100%;max-width:420px}
  .poca .f-3 .f-col .shot{width:min(120px,30vw)}
  .poca .f-3>.shot{width:min(150px,38vw)}
  .poca .mk-grid{grid-template-columns:1fr}
  .poca .mk-media .shot img{max-height:none}
  .poca .sec-wrap{padding:5vh 0;min-height:0}
  .poca .demo-frame{width:auto;max-width:100%;height:min(46vh,380px)}
  .poca .f-visual.single .shot.scrx{height:min(42vh,320px)}
}

;(()=>{
const build=cf=>{
  const cells=[...cf.children];if(!cells.length)return;
  const n=cells.length;let cur=0,timer=null;
  const paint=()=>{
    const w=cells[0].offsetWidth||200;
    const step=w*.78,z=w*.62;
    cells.forEach((el,i)=>{
      let o=i-cur;if(o>n/2)o-=n;if(o<-n/2)o+=n;
      const ao=Math.abs(o);
      el.style.transform=`translateX(${(o*step).toFixed(1)}px) translateZ(${(-ao*z).toFixed(1)}px) rotateY(${(-o*30).toFixed(1)}deg) scale(${(1-ao*.07).toFixed(3)})`;
      el.style.opacity=ao>2.6?"0":Math.max(0,1-ao*.22).toFixed(3);
      el.style.zIndex=100-Math.round(ao*10);
      el.style.pointerEvents=ao===0?"auto":"none";
    });
  };
  cells.forEach((el,i)=>el.addEventListener("click",()=>{cur=i;paint();}));
  cf.addEventListener("mouseenter",()=>clearInterval(timer));
  cf.addEventListener("mouseleave",()=>{timer=setInterval(()=>{cur=(cur+1)%n;paint();},1500)});
  cf._paint=paint;
  paint();requestAnimationFrame(paint);
  timer=setInterval(()=>{cur=(cur+1)%n;paint();},1500);
};
const spot=box=>{
  const cells=[...box.children];if(!cells.length)return;
  const apply=mx=>{
    const r=box.getBoundingClientRect();
    cells.forEach(c=>{
      const w=c.querySelector(".wrap");if(!w)return;
      const b=c.getBoundingClientRect();
      const cx=b.left-r.left+b.width/2;
      const k=Math.max(0,1-Math.abs(cx-mx)/(r.width*.62));
      w.style.transform=`translateY(${(-k*10).toFixed(1)}px) scale(${(1+k*.045).toFixed(3)})`;
      w.style.filter=k>.03?`blur(${((1-k)*1.1).toFixed(2)}px)`:"none";
      c.style.opacity=(.42+k*.58).toFixed(2);
    });
  };
  box.addEventListener("pointermove",e=>apply(e.clientX-box.getBoundingClientRect().left));
  box.addEventListener("pointerleave",()=>cells.forEach(c=>{const w=c.querySelector(".wrap");if(!w)return;w.style.transform="";w.style.filter="";c.style.opacity="";}));
};
const scan=()=>{
  document.querySelectorAll(".xhcf").forEach(cf=>{if(cf.dataset.on)return;cf.dataset.on="1";build(cf)});
  document.querySelectorAll(".xh4spot").forEach(bx=>{if(bx.dataset.so)return;bx.dataset.so="1";spot(bx)});
};
scan();
let t;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(scan,60)}).observe(document.getElementById("body")||document.body,{childList:true,subtree:true});
window.addEventListener("resize",()=>document.querySelectorAll(".xhcf").forEach(cf=>{if(cf._paint)cf._paint()}));
})();
;(()=>{
const box=document.getElementById('ldr');if(!box)return;
const num=document.getElementById('ldrNum'),bar=document.querySelector('#ldrBar i');
const srcs=Object.values(D.img).filter(u=>!/\.mp4$/i.test(u));
let done=0,shown=0,ended=false;
const fin=()=>{if(ended)return;ended=true;setTimeout(()=>{box.classList.add('off');setTimeout(()=>box.remove(),700)},220)};
const paint=()=>{
  const tg=done/srcs.length*100;
  shown+=(tg-shown)*.14;
  if(tg-shown<.35)shown=tg;
  num.textContent=Math.round(shown);
  bar.style.width=shown+'%';
  if(done>=srcs.length&&shown>99.6){num.textContent='100';bar.style.width='100%';clearInterval(tk);fin();return}
};
srcs.forEach(u=>{const im=new Image();im.onload=im.onerror=()=>{done++};im.src=u});
const tk=setInterval(paint,16);
setTimeout(()=>{if(ended)return;done=srcs.length;shown=100;num.textContent='100';bar.style.width='100%';clearInterval(tk);fin()},10000);
})();
